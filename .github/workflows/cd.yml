name: CD

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    env:
      TF_LOG: INFO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform execute
        run: | 
            cd infra && terraform init
            terraform plan -out=tfplan
            terraform apply -auto-approve tfplan

      - name: Get Kube Config
        run: |
          az aks get-credentials --resource-group devsecops --name devsecops

      - name: Install Tools and Deploy
        env:
          GIT_USER: 'git' #not validated by github, just a placeholder
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          chmod +x infra/install-tools.sh
          ./infra/install-tools.sh

      - name: Wait and Destroy
        run: |
          sleep 15m
          cd infra && terraform destroy -auto-approve
      
      - name: if error then destroy
        if: failure()
        run: |
          sleep 5m
          cd infra && terraform destroy -auto-approve
      
